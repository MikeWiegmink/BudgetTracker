services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - db-data:/data

  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
